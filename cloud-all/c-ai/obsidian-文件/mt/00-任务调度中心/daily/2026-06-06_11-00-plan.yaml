# ==================== 跨项目沉淀 (T1 owner 落 memory entry 跨日) ====================
memory_entry_proposal:
  - file: "multi-agent-orchestration.md"
    section: "§11 wiki baseline 命名规范 (新章节, 11:00 owner 主动沉淀)"
    content: |
      11:00 owner 新发现 lesson: 写 wiki baseline 必 Node.js fs readdirSync + statSync 实测目录, 不用 PowerShell Get-ChildItem (Code Page 误判) + 不用 wiki spec 段里"理想命名"。

      11:00 实测发现 4 处 wiki 命名差异:
      1. M03 持仓管理 Position.md → 实际 M03 仓位计算 PositionSizing.md (17454B)
      2. M04 指标句柄管理.md → 实际 M04 指标句柄管理 IndicatorPool.md (20738B, 有 IndicatorPool 后缀)
      3. M09 仪表盘 Dashboard.md → 实际 M09 面板 Dashboard.md (18700B)
      4. M10 报警通知 Notify.md → 实际 M10 推送通知 Notify.md (19178B)

      + M19 baseline 字节写高 521B (18000→17479)

      应对:
      - PowerShell Get-ChildItem 输出有 Code Page 误判 (中文乱码), 必用 Node.js fs readdirSync + JSON.stringify(name) 看真实文件名
      - Test-Path False + Get-ChildItem 能看到 = 文件名实际是 Unicode 私有区/不可见字符, PowerShell 显示"持仓管理"但实际是"仓位计算"
      - 写 wiki baseline 必先 Node.js fs readdirSync + statSync 实测目录
