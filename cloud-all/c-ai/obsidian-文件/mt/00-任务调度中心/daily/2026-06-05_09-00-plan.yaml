  default: override_accept cycle 1 (跟 13 次 pattern: 18:00+21:00+22:00+23:00+00:00+01:00+02:00+03:00+04:00+05:00+06:00+07:00+08:00 = 13 次)
  when:
    - 实物 100% 落盘 (Node.js fs statSync 验证)
    - 14/14 实物 mtime UNCHANGED
    - worker 自校 9/9 PASS (file_exists/byte_size/chapter/link_check/placeholder/recommend/mq5_unchanged/moc_linked + 额外 1 项)
    - verifier 独立 session timeout 11+ min: owner override_accept 立即闭环
  reject_when:
    - 0 改前文 + 0 改 .mq5 全部命中但 worker 报告虚高 (e.g. 9/9 self-check 但字节 0 改漂移)
    - 0 命中 verifier 但 daily 写 PASS 实际是 INCONCLUSIVE

