    content: |
      12:00 owner 新发现 lesson: 候补 N cron 边际收益递减 决策信号 (跨项目适用).

      候补 cron 数 vs 边际收益:
      - 0-5 cron: 高 (新候补, 等 user 启动) — 06-05 1:00-3:00
      - 5-10 cron: 中 (持续候补, spec 完整) — 06-05 4:00-9:00
      - 10-15 cron: 低 (候补价值递减) — 06-05 10:00-23:00
      - 15-20 cron: 极低 (候补接近无效) — 06-06 0:00-11:00
      - 20+ cron: 接近 0 (候补失效) — 06-06 12:00 主动报告

      owner posture 3 阶段:
      1. 0-15 cron: 单纯等 user IM
      2. 15-20 cron: 主动报告 "候补 N cron"
      3. 20+ cron: 主动建议 6 路径 (A-F), 不擅自启 plan

      6 路径:
      - 路径 A: 启候选 P3 R3 (1h 0 阻塞, user IM 触发)
      - 路径 B: 启候选 T5 R3 (1h 0 阻塞, user IM 触发)
      - 路径 C: 启候选 P3 R3 + T5 R3 双 worker 并行 (1.5h 0 跨周期, max_concurrency=2, user IM 触发)
      - 路径 D: 阻塞 4 件降级 (e.g. ScalpingMartin spec 整理 0 GUI 阻塞 0.5h, user IM 触发)
      - 路径 E: 新候选孵化 (候选 Z 性能调优 / AA 异常处理 / AB _archive 复活 SOP 第 2 轮, user IM 触发)
      - 路径 F (默认): 维持等用户授权姿势 (0 越权 0 风险 0 漂移 0 阻塞, 默认 13:00 cron 收尾)

      应对 (跨项目适用):
      - owner 不擅自启 plan, 但应在 §XX:00.2 主动列出 6 路径
      - 跟 user 显式控制权不冲突, 是 owner 把决策选项透明化
      - 路径 A/B/C (启候选) 是 user 显式 "#N" 触发的, owner 不主动启
      - 路径 D (阻塞降级) 是 owner 可以主动做的, 但同样需要 user IM 显式 "降级 #14"
      - 路径 E (新候选孵化) 是 owner 主动决策, 但需 user IM 显式同意

      写入时机: user IM 显式 "同意落盘 §8" → 12:00 owner T1 收尾 → 13:00 落盘
