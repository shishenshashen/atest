      1. §0 摘要 (200 字): EA 出错怎么办? 19 模块 errcode / retcode / timeout / fallback 范本

      2. §1 4 大异常维度 (OrderSend retcode 12 码表 / Indicator handle 失效 3 fallback / 文件 I/O 失败 5 errno / 网络连接失败 3 重试)

