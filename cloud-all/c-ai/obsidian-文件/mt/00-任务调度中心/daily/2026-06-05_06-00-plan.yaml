      6. §5 10 步异常处理 SOP (捕获/记录/通知/重试/降级/兜底/恢复/复盘/修复/验证) + §6 5 反模式 + §7 链向


      ## 4 异常维度详

      1. **OrderSend retcode (M01+M02)**: 12 个 retcode 码表 (10004 requote / 10006 request rejected / 10007 request canceled by trader / 10008 order placed / 10009 order modified / 10010 partial close / 10013 invalid request / 10014 invalid price / 10015 invalid stops / 10016 invalid volume / 10018 market closed / 10019 no money)

      2. **Indicator handle 失效 (M04)**: 3 种 fallback (重新创建 / 退避重试 / 跳过本次)

      3. **文件 I/O 失败 (M13)**: 5 种 errno (file not found / access denied / disk full / path too long / sharing violation)

      4. **网络/连接失败 (M10+M17)**: 3 种重试 (exponential backoff / circuit breaker / graceful degradation)


      ## 5 实物 demo (Node.js fs 实测接入点行号, 必填)

      1. **MeanReversion_EA** — M01 retcode 10006 (requote) 重试 demo (OnTrade 段位)

      2. **ScalperXAU v1-v4** — M13 FileIO 失败 fallback 到 Print (OnTick 段位)

      3. **Dashboard** — M15 TimerService 失效重连 (M15.OnTimer 段位)

      4. **MyEA** — M10 Notify 网络失败 retry-with-backoff (M10.Send 段位)

      5. **ScalperXAUv5-v9** — 5 个副仓异常隔离 (v5=Print / v6=Stop / v7=Retry / v8=Skip / v9=Fallback)


      ## 10 步异常处理 SOP

      1. **捕获** — try/catch 或 retcode 检查

      2. **记录** — M11.Logger.Error(...) 写文件 + 控制台

      3. **通知** — M10.Notify.AlertOnError(...) 发微信/Telegram

      4. **重试** — exponential backoff (1s/2s/4s/8s)

      5. **降级** — fallback 到简化模式 (如 Indicator 失败用 close price)

      6. **兜底** — Print 详细错误 + GetLastError() 上下文

      7. **恢复** — 重新初始化 (M04 IndicatorPool Refresh)

      8. **复盘** — M11.Logger 日志分析 + Journal (Ctrl+5)

      9. **修复** — 修代码 + 0 errors 编译

      10. **验证** — 回测 + 模拟账户 24h + 实盘


      ## 5 反模式 (不与 80 ❌ baseline 重复)

      ❌ 吞掉错误 (try/catch 不 Print)

      ❌ 重试无退避 (立即 retry 1000 次)

      ❌ fallback 默认值 (magic=0 掩盖问题)

      ❌ 异常当正常 (return != SUCCESS 当成功)

      ❌ 静默失败 (retcode 10004 不通知)


